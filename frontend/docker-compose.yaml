services:
  app:
    # The image builds from the REPOSITORY ROOT so `npm ci` can read the
    # committed root package-lock.json (S-29). deploy/compose/ is the maintained
    # stack; this file is a standalone convenience.
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    expose:
      - "3000"

  nginx:
    # P7-07: a version, not the moving `stable` channel; same as deploy/compose.
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "80:80"
