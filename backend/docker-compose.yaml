  redis:
    image: redis:8.6-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - ./data/redis:/data
    healthcheck:
      # PONG only once Redis is serving; poll fast so the backend starts promptly.
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: rabbitmq
    restart: unless-stopped
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    volumes:
      - ./data/rabbitmq:/var/lib/rabbitmq
    healthcheck:
      # `ping` only proves the Erlang node is up; check_port_connectivity proves
      # the AMQP listener (5672) is actually accepting connections — i.e. ready
      # for the backend to connect. RabbitMQ (with the management plugin) can
      # take a while on first boot, so allow a long start_period + many retries.
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 60s

  postgres:
    # pgvector-enabled Postgres: the AI RAG module stores document embeddings in
    # a `vector(1536)` column and migration 0018 runs `CREATE EXTENSION vector`.
    # Plain postgres:17-alpine lacks the extension, so use the official pgvector
    # image (PG 17 + pgvector preinstalled).
    image: pgvector/pgvector:pg17
    container_name: postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      PGDATA: /var/lib/postgresql/data/pgdata
      TZ: Asia/Jakarta
      PGTZ: Asia/Jakarta
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      # pg_isready reports success only when the server is accepting connections.
      # Poll every 5s so the backend starts promptly once Postgres is ready; the
      # generous start_period + retries tolerate first-boot data-dir init.
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    restart: unless-stopped
    ports:
      - "${PGADMIN_PORT:-8888}:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-pgadmin@local.dev}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    volumes:
      - ./data/pgadmin:/var/lib/pgadmin
    depends_on:
      - postgres

  # ClamAV daemon for the attachment virus-scan module. The backend talks to it
  # over clamd's TCP socket (3310) when VIRUS_SCAN_PROVIDER=clamav and
  # CLAMAV_ENABLED=true (set CLAMAV_HOST=clamav, CLAMAV_PORT=3310 in .env).
  # freshclam refreshes signatures inside the container; first boot downloads the
  # DB, so the health check allows a long start_period.
  clamav:
    image: clamav/clamav:latest
    container_name: clamav
    restart: unless-stopped
    ports:
      - "${CLAMAV_PORT:-3310}:3310"
    volumes:
      - ./data/clamav:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 120s
