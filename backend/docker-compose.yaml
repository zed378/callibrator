# Datastores for a SOURCE CHECKOUT (backend on the host: `npm run dev`).
# Every port binds to 127.0.0.1 only (S-19): a laptop on hospital wifi must not
# publish an unauthenticated Redis, a password-less pgAdmin and clamd to the
# LAN. deploy/compose/ is the maintained stack.
services:
  # backend:
  #   # build: .
  #   image: zed378/calibration-be:latest
  #   container_name: backend
  #   restart: unless-stopped
  #   env_file:
  #     - .env
  #   ports:
  #     - "127.0.0.1:${BACKEND_PORT:-3000}:3000"
  #   volumes:
  #     - ./uploads:/app/uploads
  #     - ./backup:/app/backup
  #     - ./log:/app/log
  #   # Wait for the datastores to be READY (not merely started) before booting —
  #   # the backend runs db.sync() + migrations against Postgres at startup, so it
  #   # must not start until Postgres is accepting connections (pg_isready). Redis
  #   # and RabbitMQ are also connected to at boot. ClamAV's first-run freshclam
  #   # takes minutes and virus scanning is optional, so only require it started.
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy
  #     rabbitmq:
  #       condition: service_healthy
  #     clamav:
  #       condition: service_started
  #   healthcheck:
  #     test:
  #       [
  #         "CMD",
  #         "wget",
  #         "--quiet",
  #         "--tries=1",
  #         "--spider",
  #         "http://localhost:3000/health",
  #       ]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 3
  #     start_period: 40s

  redis:
    image: redis:8.6-alpine@sha256:bb2e2e3ac0c7295b6f3b1b7ee5438f7320c74483cba1cb195f3fd43dad38de67
    container_name: redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - ./data/redis:/data
    healthcheck:
      # PONG only once Redis is serving; poll fast so the backend starts promptly.
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  rabbitmq:
    image: rabbitmq:3.13-management-alpine@sha256:606d8c0d6b3c18d1da9afc53bc7cdb2a8d5486df91b5a9830e9e07626c9ae281
    container_name: rabbitmq
    restart: unless-stopped
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MGMT_PORT:-15672}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    volumes:
      - ./data/rabbitmq:/var/lib/rabbitmq
    healthcheck:
      # `ping` only proves the Erlang node is up; check_port_connectivity proves
      # the AMQP listener (5672) is actually accepting connections — i.e. ready
      # for the backend to connect. RabbitMQ (with the management plugin) can
      # take a while on first boot, so allow a long start_period + many retries.
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 60s

  postgres:
    # pgvector-enabled Postgres: the AI RAG module stores document embeddings in
    # a `vector(1536)` column and migration 0018 runs `CREATE EXTENSION vector`.
    # Plain postgres:18-alpine lacks the extension, so use the official pgvector
    # image (PG 17 + pgvector preinstalled).
    image: pgvector/pgvector:pg18@sha256:2ba9ca5f2e7daa0f0e7723cba1ee9167bab54efd3640516a44ac1a928dd67e7a
    container_name: postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      PGDATA: /var/lib/postgresql/data/pgdata
      TZ: Asia/Jakarta
      PGTZ: Asia/Jakarta
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      # pg_isready reports success only when the server is accepting connections.
      # Poll every 5s so the backend starts promptly once Postgres is ready; the
      # generous start_period + retries tolerate first-boot data-dir init.
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  pgadmin:
    # P7-07: pinned (was :latest). Same version as deploy/compose/docker-compose.dev.yml.
    image: dpage/pgadmin4:8.14@sha256:8a68677a97b8c8d1427dc915672a26d2c4a04376916a68256f53d669d6171be7
    container_name: pgadmin
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-8888}:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-pgadmin@local.dev}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    volumes:
      - ./data/pgadmin:/var/lib/pgadmin
    depends_on:
      - postgres

  # ClamAV daemon for the attachment virus-scan module. The backend talks to it
  # over clamd's TCP socket (3310) when VIRUS_SCAN_PROVIDER=clamav and
  # CLAMAV_ENABLED=true (set CLAMAV_HOST=clamav, CLAMAV_PORT=3310 in .env).
  # freshclam refreshes signatures inside the container; first boot downloads the
  # DB, so the health check allows a long start_period.
  clamav:
    # P7-07: pinned (was :latest) — the tag the S-04 client was verified
    # against, by digest. How to move it: docs/DEVOPS/02-CONTAINERIZATION.md.
    image: clamav/clamav:1.4@sha256:a5f03c12a79dbe9f6d8a527b6bb1ea053fa8dd061d3738a26897f055ee2d9303
    container_name: clamav
    restart: unless-stopped
    ports:
      - "127.0.0.1:${CLAMAV_PORT:-3310}:3310"
    volumes:
      - ./data/clamav:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 120s
