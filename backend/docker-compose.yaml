  #   # and RabbitMQ are also connected to at boot. ClamAV's first-run freshclam
  #   # takes minutes and virus scanning is optional, so only require it started.
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy
