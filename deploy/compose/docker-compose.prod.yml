# Callibrator — production overlay
#
#   make up ENV=prod
#
# Database ports are NOT published. Images are pinned by tag — `:latest` in
# production means nobody can say what is running, and a rollback has nothing
# to roll back to. Set IMAGE_TAG to the release's short commit (the tag
# scripts/release/push-images.ps1 pushed); to pin the content as well, set
# BACKEND_DIGEST / FRONTEND_DIGEST / BACKUP_DIGEST (sha256:..., printed by the
# script). Images are PULLED from the registry (ADR-123), never built here.

services:
  backend:
    image: ${BACKEND_IMAGE:-zed378/calibration-be}:${IMAGE_TAG:?IMAGE_TAG is required in production}${BACKEND_DIGEST:+@${BACKEND_DIGEST}}
    # No build: production runs a promoted image, never a local build. The base
    # file declares none since ADR-123; the reset keeps it so even if someone
    # stacks docker-compose.build.yml underneath.
    build: !reset null
    environment:
      NODE_ENV: production
      FORCE_HTTPS: "true"
      # Explicit, comma-separated. Never a wildcard — this policy runs with
      # credentials:true.
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN is required in production}
      # Must be unset. Inline mode makes a batch job synchronous with whatever
      # triggered it, reintroducing the 30s timeout it exists to avoid.
      BATCH_JOBS_INLINE: ""
      # A demo seeder running against real data is a data-integrity incident.
      SEED_DEMO: ""
      # Fail-closed: a scanner error rejects the upload.
      VIRUS_SCAN_PROVIDER: clamav
      VIRUS_SCAN_FAIL_OPEN: "false"
      # ACME_DIRECTORY_URL is NOT required here any more (S-09, ADR-081). This
      # line used to be `${ACME_DIRECTORY_URL:?...}`, but no backend code has
      # read the variable since the ACME stub was removed (A-256) and
      # .env.example ships it commented out — so the first by-the-book
      # `make up ENV=prod` stopped at interpolation, guarding a setting nothing
      # uses. If automatic certificates are ever built, the guard comes back
      # together with the code that reads it.
      # local storage is incompatible with more than one backend replica:
      # replica A writes an attachment, replica B cannot serve it.
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      # Schedulers run once PER REPLICA. Exactly one instance must run them, or
      # every backup and every retention purge runs twice.
      SESSION_CLEANUP_SCHEDULER: ${SESSION_CLEANUP_SCHEDULER:-0 2 * * *}
      BACKUP_SCHEDULER: ${BACKUP_SCHEDULER:-0 3 * * 0}
      RETENTION_SCHEDULER: ${RETENTION_SCHEDULER:-0 2 * * *}
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    deploy:
      resources:
        limits:
          # ADR-095 follow-up (2026-09-30): re-sized to measured need. The backend image has no
          # Chromium; measured on callibrator/backend:adr095f under boot + migrations, seeding,
          # three live E2E runs (two concurrent) and six browser-smoke runs: cgroup memory.peak 306
          # MiB, Node VmHWM 337 MiB, steady 215-265 MiB
          # (MEMORY/records/2026-09-30-adr095-followups.md). Not production traffic: re-measure
          # under a real tenant's exports/reports before tightening further. Production gets 1.5G,
          # ~4.5x the measured peak, for larger tenants' exports; a CPU limit still bounds a runaway
          # request (S-19).
          cpus: "2.0"
          memory: 1536M
        reservations:
          memory: 512M

  # U-05 (ADR-116): the nightly dump + restore verification, from the promoted
  # image of the SAME tag as the backend (its binary runs the schema check).
  # scripts/release/push-images.ps1 builds and pushes it with the release, FROM
  # the backend image of the same tag (ADR-123).
  db-backup:
    image: ${BACKUP_IMAGE:-zed378/calibration-backup}:${IMAGE_TAG:?IMAGE_TAG is required in production}${BACKUP_DIGEST:+@${BACKUP_DIGEST}}
    build: !reset null
    restart: always
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }
    deploy:
      resources:
        limits:
          # One throwaway PostgreSQL server during the verification, idle otherwise.
          cpus: "2.0"
          memory: 2G

  frontend:
    # DEPLOYMENT-SPECIFIC (NEXT_PUBLIC_* are inlined at build): the default
    # repository is built for the reference deployment's URL. Point
    # FRONTEND_IMAGE at a frontend built for THIS deployment's URL (ADR-123).
    image: ${FRONTEND_IMAGE:-zed378/calibration-fe}:${IMAGE_TAG:?IMAGE_TAG is required in production}${FRONTEND_DIGEST:+@${FRONTEND_DIGEST}}
    build: !reset null
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  postgres:
    # Deliberately no `ports:` — the database is not reachable from outside the
    # deployment network.
    restart: always
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 8G
        reservations:
          memory: 2G

  redis:
    # Persistence matters here beyond caching: losing ./volumes/redis discards
    # in-flight worker idempotency claims and reopens the duplicate window.
    restart: always
    # AOF persistence through the base file's command, which also applies
    # --requirepass when REDIS_PASSWORD is set (S-09). Overriding `command`
    # here, as this file used to, would silently drop the password.
    environment:
      REDIS_APPENDONLY: "yes"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 1G

  rabbitmq:
    restart: always
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2G

  clamav:
    restart: always
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2G

  nginx:
    restart: always
    ports:
      - "80:80"
      - "443:443"
    logging:
      driver: json-file
      options: { max-size: "50m", max-file: "5" }
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
