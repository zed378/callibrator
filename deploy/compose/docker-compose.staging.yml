# Callibrator — staging overlay
#
#   make up ENV=staging
#
# Production-shaped, with sandbox external services and anonymised data.
#
# The one rule that matters here: a LIVE provider key in staging passes every
# per-field check — valid string, right shape, right length — and will charge a
# real card from a test. Only a cross-field rule comparing the key's
# environment marker against NODE_ENV catches it.
# See docs/SECURITY/07-CRYPTOGRAPHY-AND-SECRETS.md.

services:
  backend:
    image: ${BACKEND_IMAGE:-zed378/calibration-be}:${IMAGE_TAG:?IMAGE_TAG is required}${BACKEND_DIGEST:+@${BACKEND_DIGEST}}
    environment:
      NODE_ENV: production
      FORCE_HTTPS: "true"
      # Explicit origins. A wildcard is never honoured: this CORS policy runs
      # with credentials:true, and reflecting an arbitrary origin would let any
      # site make authenticated cross-origin requests.
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN is required}
      # Unset in staging and production — inline mode makes a batch job
      # synchronous with whatever triggered it, reintroducing the 30s timeout
      # it exists to avoid.
      BATCH_JOBS_INLINE: ""
      # Never true outside development.
      SEED_DEMO: ""
      # Fail-closed on a scanner error (the default) is deliberate.
      VIRUS_SCAN_PROVIDER: clamav
      VIRUS_SCAN_FAIL_OPEN: "false"
      # ACME_DIRECTORY_URL removed (ADR-081): nothing reads it since A-256.
    deploy:
      resources:
        limits:
          # ADR-095 follow-up (2026-09-30): re-sized to measured need. The backend image has no
          # Chromium; measured on callibrator/backend:adr095f under boot + migrations, seeding,
          # three live E2E runs (two concurrent) and six browser-smoke runs: cgroup memory.peak 306
          # MiB, Node VmHWM 337 MiB, steady 215-265 MiB
          # (MEMORY/records/2026-09-30-adr095-followups.md). Not production traffic: re-measure
          # under a real tenant's exports/reports before tightening further. Staging gets 1G, 3x the
          # measured peak; a CPU limit too (S-19).
          cpus: "2.0"
          memory: 1G
        reservations:
          memory: 384M

  frontend:
    # Deployment-specific: a frontend built for the staging URL (ADR-123).
    image: ${FRONTEND_IMAGE:-zed378/calibration-fe}:${IMAGE_TAG:?IMAGE_TAG is required}${FRONTEND_DIGEST:+@${FRONTEND_DIGEST}}
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  postgres:
    # Not published. Reach it through the host, not the internet.
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2G

  redis:
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  rabbitmq:
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  clamav:
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2G

  nginx:
    ports:
      - "80:80"
      - "443:443"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
