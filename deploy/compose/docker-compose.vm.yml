# Callibrator — single-host VM overlay (plain HTTP, images built locally).
#
#   docker compose -f docker-compose.yml -f docker-compose.vm.yml up -d --build
#
# Differs from the prod overlay in two ways, both deliberate:
#   - images are BUILT here rather than pulled, because there is no registry
#   - nginx serves plain HTTP on a high port, because there is no public
#     domain and therefore no certificate
#
# PORT ALLOCATION — the 19xxx block, chosen because this host already runs nine
# other compose projects. 3000, 5432 and 8080 are all taken; the defaults in
# docker-compose.dev.yml would collide with commercial2026-api, stocks-postgres
# and stirling-pdf respectively.
#
#   0.0.0.0:19080   nginx        the only publicly reachable port
#   127.0.0.1:19000 backend      direct access for debugging
#   127.0.0.1:19432 postgres     psql for debugging
#   127.0.0.1:19673 rabbitmq     management UI
#
# (19883 was once listed here for MQTT. A-17 removed that mapping — nothing
# listened on it; see the note under backend.ports.)
#
# Everything else stays on the compose network with no host binding.

services:
  backend:
    build:
      # Context is the REPOSITORY ROOT so the build can `npm ci` against the
      # committed root package-lock.json (ADR-044, S-13). See backend/Dockerfile.
      context: ../..
      dockerfile: backend/Dockerfile
    environment:
      NODE_ENV: production
      # No TLS at this layer — nginx terminates plain HTTP, so forcing an
      # HTTPS redirect would produce a loop.
      FORCE_HTTPS: "false"
      # Single origin: the browser reaches everything through nginx.
      CORS_ORIGIN: ${CORS_ORIGIN}
      # Unset in production — inline mode makes a batch job synchronous with
      # whatever triggered it, reintroducing the 30s timeout it exists to avoid.
      BATCH_JOBS_INLINE: ""
      # A demo seeder against real data is a data-integrity incident. This is a
      # fresh deployment with no real data yet, so it is enabled for the first
      # boot; turn it off once the tenant is created.
      SEED_DEMO: ${SEED_DEMO:-false}
      VIRUS_SCAN_PROVIDER: ${VIRUS_SCAN_PROVIDER:-clamav}
      VIRUS_SCAN_FAIL_OPEN: "false"
      STORAGE_DRIVER: local
      # Schedulers run once per replica. This deployment is single-replica, so
      # they are enabled here.
      SESSION_CLEANUP_SCHEDULER: "0 2 * * *"
      BACKUP_SCHEDULER: "0 3 * * 0"
      RETENTION_SCHEDULER: "0 2 * * *"
    ports:
      - "127.0.0.1:${BACKEND_PORT:-19000}:3000"
      # A-17: the 0.0.0.0:19883 -> 1883 mapping was removed on 2026-09-23. The
      # backend is an MQTT CLIENT of an external broker, so nothing listened
      # there: it published a port on the public interface with nothing behind
      # it. If a sidecar broker is ever added, publish ITS port, and bind it to
      # 127.0.0.1 unless devices really must reach it from outside.
    restart: unless-stopped

  frontend:
    environment:
      # Server-only, read at RUNTIME (no NEXT_PUBLIC_ prefix, so it is never
      # inlined into the client bundle). The Next proxy routes use it to reach
      # the backend directly; the browser keeps using the public URL for
      # Socket.IO. See frontend/src/constants/index.ts.
      BACKEND_INTERNAL_URL: ${BACKEND_INTERNAL_URL:-http://backend:3000}
    build:
      # Context is the REPOSITORY ROOT so the build can `npm ci --workspace
      # frontend` against the committed root package-lock.json (ADR-044, S-29).
      # See frontend/Dockerfile and frontend/Dockerfile.dockerignore.
      context: ../..
      dockerfile: frontend/Dockerfile
      args:
        # INLINED AT BUILD TIME. This one value is used BOTH server-side (the
        # Next.js proxy at /api/v1/[...path] forwards to it) and client-side
        # (Socket.IO connects to it directly), so it must be reachable from the
        # browser AND from inside the frontend container. The host IP satisfies
        # both; an internal service name would break the browser.
        NEXT_PUBLIC_API_BASE_URL: ${PUBLIC_URL}
        NEXT_PUBLIC_SITE_URL: ${PUBLIC_URL}
        NEXT_PUBLIC_TENANT_ID: ${NEXT_PUBLIC_TENANT_ID:-}
    restart: unless-stopped

  postgres:
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-19432}:5432"
    restart: unless-stopped

  redis:
    # Persistence matters beyond caching: losing this volume discards in-flight
    # worker idempotency claims and reopens the duplicate window.
    command: ["redis-server", "--appendonly", "yes"]
    restart: unless-stopped

  rabbitmq:
    ports:
      - "127.0.0.1:${RABBITMQ_MGMT_PORT:-19673}:15672"
    restart: unless-stopped

  clamav:
    restart: unless-stopped

  nginx:
    volumes:
      # HTTP-only server block. The default config listens on 443 and would
      # fail to start without certificates.
      - ./nginx/vm-http.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "0.0.0.0:${HTTP_PORT:-19080}:80"
    restart: unless-stopped

# A-16 — the compose network's address is PINNED so nginx can name the one hop
# it trusts. cloudflared runs on the VM host and reaches nginx through
# localhost:19080; inside the container that connection arrives from this
# network's gateway, 172.30.19.1. nginx/vm-http.conf trusts CF-Connecting-IP
# from that address and from nothing else. The two values must change together.
#
# Pinning an existing deployment's network needs the network recreated:
#   docker compose -f docker-compose.yml -f docker-compose.vm.yml down
#   docker compose -f docker-compose.yml -f docker-compose.vm.yml up -d --build
# (the data is in bind-mounted ./volumes and survives). If `up` fails with
# "Pool overlaps with other one on this address space", another network on the
# host already holds the range: pick a free /24 and change it here AND in
# vm-http.conf's set_real_ip_from.
networks:
  default:
    ipam:
      config:
        - subnet: 172.30.19.0/24
          gateway: 172.30.19.1
