# Callibrator — nginx
#
# Four routes here are easy to omit and all four fail confusingly.
# See docs/DEVOPS/03-REVERSE-PROXY.md.

upstream backend  { server backend:3000;  }
upstream frontend { server frontend:3000; }

# --------------------------------------------------------------------------
# HTTP → HTTPS, except the ACME challenge path
# --------------------------------------------------------------------------
server {
    listen 80;
    server_name _;

    # Must stay reachable over HTTP for HTTP-01 validation. The backend serves
    # these from storagePath(".well-known") — the WRITABLE storage root,
    # because challenge files are written at runtime. A CWD-relative path
    # shifts with the launch directory, and the resulting failures look like
    # DNS problems.
    location /.well-known/acme-challenge/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --------------------------------------------------------------------------
# HTTPS
# --------------------------------------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Match the application's 10 MB body limit. A smaller value here produces a
    # 413 the application never sees and cannot explain.
    client_max_body_size 10m;

    # The application times out at 30s and returns 408.
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    # NOT cosmetic. This reaches sessions.ip_address, audit_logs.ipAddress,
    # e_signature_records.ipAddress (21 CFR Part 11 evidence),
    # consent_records.ipAddress, and the per-source rate limiters. Without it
    # every request appears to come from the proxy — which makes session
    # binding meaningless and the signature evidence WRONG.
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    # FORCE_HTTPS reads this. Omitting it produces a redirect loop.
    proxy_set_header X-Forwarded-Proto $scheme;

    # ----------------------------------------------------------------------
    # Socket.IO — WITHOUT the upgrade headers this SILENTLY falls back to
    # long-polling. It works, notifications arrive, nothing errors, and nobody
    # notices until connection counts matter. This is the deployment mistake
    # most likely to go undetected in this system.
    # ----------------------------------------------------------------------
    location /socket.io/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        # The 60s default kills idle WebSocket connections and produces a
        # reconnect storm that looks like network instability.
        proxy_read_timeout 3600s;
    }

    # ----------------------------------------------------------------------
    # OIDC — at the ROOT, not under /api/v1. The discovery document advertises
    # its endpoints at <issuer>/oidc/..., where the issuer is the host root, so
    # relying parties fetch them there. The backend mounts the OIDC router
    # twice for exactly this reason.
    # ----------------------------------------------------------------------
    location /oidc/ {
        proxy_pass http://backend;
    }

    # ACME challenges (also served over HTTPS once a certificate exists).
    location /.well-known/ {
        proxy_pass http://backend;
    }

    # ----------------------------------------------------------------------
    # API — /api/ goes to the FRONTEND, not the backend.
    #
    # Next.js owns this path: app/api/v1/auth/login sets the httpOnly
    # auth_token cookie, and app/api/v1/[...path] injects Authorization from
    # that cookie on every later call. Routing /api/ straight to the backend
    # bypasses both — login returns a token that nothing stores, and every
    # authenticated request afterwards arrives with no credentials.
    #
    # Next reaches the backend server-side via BACKEND_INTERNAL_URL (set on the
    # frontend service in docker-compose.yml). Without it the proxy falls back
    # to NEXT_PUBLIC_API_BASE_URL — the public origin — which re-enters this
    # location and loops.
    #
    # This file used to send /api/ to the backend while vm-http.conf, deploy/
    # README.md and docs/DEVOPS/03-REVERSE-PROXY.md all said the opposite (S-07).
    # ----------------------------------------------------------------------
    location /api/ {
        proxy_pass http://frontend;
    }

    # ----------------------------------------------------------------------
    # Uploads. The backend sets X-Content-Type-Options: nosniff and
    # Content-Disposition: inline on every response here. DO NOT strip or
    # override them — they are the defence against a browser sniffing an
    # upload into active content.
    # ----------------------------------------------------------------------
    location /uploads/ {
        proxy_pass http://backend;
    }

    # Readiness verdict: {"status":"ok"} (200) or {"status":"unavailable"}
    # (503) over PostgreSQL, Redis and RabbitMQ — nothing else, since this is
    # public. An upstream returning 503 should leave rotation, not be
    # restarted. /live and /ready are deliberately not published here.
    location /health {
        proxy_pass http://backend/health;
        access_log off;
    }

    # ----------------------------------------------------------------------
    # Everything else — including the PUBLIC certificate verification page at
    # /verify/<certificateNumber>, which must work without a session.
    # ----------------------------------------------------------------------
    location / {
        proxy_pass http://frontend;
    }

    # The backend already applies compression(). Enabling gzip here as well
    # double-compresses — pick one layer.
    gzip off;
}
