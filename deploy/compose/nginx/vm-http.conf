# Callibrator — nginx for a plain-HTTP VM deployment.
#
# No TLS: this stack is reached at http://<vm-ip>:19080 with no public domain
# and no certificate. Everything else matches deploy/compose/nginx/default.conf
# — in particular the four routes that fail confusingly when omitted.
#
# See docs/DEVOPS/03-REVERSE-PROXY.md.

upstream backend  { server backend:3000;  }
upstream frontend { server frontend:3000; }

# ----------------------------------------------------------------------
# THE CLIENT'S SCHEME (A-102, same trust rule as the address — ADR-050)
#
# Cloudflare terminates TLS and cloudflared talks plain HTTP to this nginx,
# so $scheme is always "http". Forwarding it made the backend see every
# tunnelled browser as insecure: req.secure false, req.protocol "http" (the
# QR verify URL and signed attachment URLs are built from it).
#
# The browser's scheme is taken from CF-Visitor ({"scheme":"https"}), which
# Cloudflare sets — and only when the connection comes from the tunnel
# gateway, the one peer trusted for CF-Connecting-IP below. $realip_remote_addr
# is the PEER address, before realip rewrote $remote_addr. A client that
# connects to :19080 directly arrives from its own address, so whatever
# CF-Visitor or X-Forwarded-Proto it sends is ignored and its real $scheme
# is forwarded. 172.30.19.1 must change together with set_real_ip_from and
# docker-compose.vm.yml (networks.default).
# ----------------------------------------------------------------------
map $realip_remote_addr $from_tunnel {
    172.30.19.1 1;
    default     0;
}

map "$from_tunnel:$http_cf_visitor" $client_proto {
    "~^1:.*\"scheme\"\s*:\s*\"https\"" https;
    "~^1:.*\"scheme\"\s*:\s*\"http\""  http;
    default                            $scheme;
}

server {
    listen 80;
    server_name _;

    # Match the application's 10 MB body limit. A smaller value here produces a
    # 413 the application never sees and cannot explain.
    client_max_body_size 10m;

    # The application times out at 30s and returns 408.
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    # ----------------------------------------------------------------------
    # THE CLIENT ADDRESS (A-16)
    #
    # The public path is  browser -> Cloudflare -> cloudflared (on the VM host,
    # tunnelled to http://localhost:19080) -> this nginx. Every tunnelled
    # request therefore arrives from ONE address: the gateway of the compose
    # network, which is what the host's connection to a published port looks
    # like from inside the container. Cloudflare puts the real client in
    # CF-Connecting-IP, overwriting whatever the browser sent.
    #
    # realip replaces $remote_addr with CF-Connecting-IP ONLY when the
    # connection comes from that gateway. Port 19080 is also reachable on the
    # VM's own address, and a client connecting there directly arrives from
    # its own address — so its CF-Connecting-IP, or anything else it sends, is
    # ignored and $remote_addr stays the address it really connected from.
    #
    # 172.30.19.1 is pinned by docker-compose.vm.yml (networks.default). The
    # two must change together. Trusting the gateway means trusting every
    # process on the VM host that can open a socket to :19080 — which the
    # tunnel already has to be.
    set_real_ip_from  172.30.19.1;
    real_ip_header    CF-Connecting-IP;
    real_ip_recursive off;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    # NOT cosmetic. This reaches sessions.ip_address, audit_logs.ipAddress and
    # e_signature_records.ipAddress (21 CFR Part 11 evidence), and the per-IP
    # auth limiter. OVERWRITTEN with the one resolved address, never appended
    # to ($proxy_add_x_forwarded_for): an appended header carries the
    # browser's own value on the left. The backend trusts one hop
    # (TRUST_PROXY_HOPS) and so reads exactly this value; the Next proxy
    # routes forward it on the /api/ path.
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $client_proto;
    # Consumed above (CF-Visitor by the $client_proto map, A-102). Nothing
    # downstream may read them: on a direct connection
    # they are whatever the client typed.
    proxy_set_header CF-Connecting-IP  "";
    proxy_set_header CF-Visitor        "";

    # ----------------------------------------------------------------------
    # Socket.IO — WITHOUT the upgrade headers this SILENTLY falls back to
    # long-polling. It works, notifications arrive, nothing errors, and nobody
    # notices until connection counts matter.
    # ----------------------------------------------------------------------
    location /socket.io/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        # A location with ANY proxy_set_header of its own inherits NONE from the
        # server block, so the client-address headers are repeated here —
        # without them the handshake reaches the backend with no
        # X-Forwarded-For and req.ip is nginx (A-16).
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $client_proto;
        proxy_set_header CF-Connecting-IP  "";
        proxy_set_header CF-Visitor        "";
        # The 60s default kills idle WebSocket connections and produces a
        # reconnect storm that looks like network instability.
        proxy_read_timeout 3600s;
    }

    # ----------------------------------------------------------------------
    # OIDC — at the ROOT, not under /api/v1. The discovery document advertises
    # its endpoints at <issuer>/oidc/..., so relying parties fetch them there.
    # The backend mounts the OIDC router twice for exactly this reason.
    # ----------------------------------------------------------------------
    location /oidc/ {
        proxy_pass http://backend;
    }

    # ACME HTTP-01 challenges. Unused without a public domain, but routed so a
    # later custom-domain test does not fail in a way that looks like DNS.
    location /.well-known/ {
        proxy_pass http://backend;
    }

    # /api/ goes to the FRONTEND, not the backend.
    #
    # Next.js owns this path: app/api/v1/auth/login sets the httpOnly
    # auth_token cookie, and app/api/v1/[...path] injects Authorization from
    # that cookie on every later call. Routing /api/ straight to the backend
    # bypasses both — login returns a token that nothing stores, and every
    # authenticated request afterwards arrives with no credentials.
    #
    # Next reaches the backend server-side via BACKEND_INTERNAL_URL.
    location /api/ {
        proxy_pass http://frontend;
    }

    # Uploads — ONLY the public class (S-01, ADR-042 step 3): avatars, tenant
    # logos, CMS images. The backend sets a pinned image Content-Type,
    # nosniff, Content-Disposition: inline and a sandbox CSP — do not
    # override. Every other /uploads/ path (it used to expose certificates
    # and attachments) is refused here; those are served only under /api/.
    location /uploads/public/ {
        proxy_pass http://backend;
    }
    location /uploads/ {
        return 404;
    }

    # No Swagger location, deliberately (S-23). Two rules here once proxied
    # /api-docs and /swagger.json, which the backend does not serve — it mounts
    # the UI at /docs and the spec at /docs.json (src/docs/swagger.js), with no
    # authentication. Do not add a /docs location: it would publish the whole
    # API contract unauthenticated. Reach it on the loopback backend port
    # instead (127.0.0.1:19000/docs).

    # Readiness verdict: {"status":"ok"} (200) or {"status":"unavailable"}
    # (503) over PostgreSQL, Redis and RabbitMQ — nothing else, since this is
    # public.
    location /health {
        proxy_pass http://backend/health;
        access_log off;
    }

    # Everything else — including the PUBLIC certificate verification page at
    # /verify/<certificateNumber>, which must work without a session.
    location / {
        proxy_pass http://frontend;
    }

    # The backend already applies compression(). Enabling gzip here as well
    # double-compresses — pick one layer.
    gzip off;
}
