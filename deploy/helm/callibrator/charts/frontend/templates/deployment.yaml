apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "callibrator.baseName" . }}-frontend
  labels:
    app.kubernetes.io/name: callibrator-frontend
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: callibrator-frontend
      app.kubernetes.io/instance: {{ .Release.Name }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: callibrator-frontend
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: web
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        # Numeric, and matching the uid/gid frontend/Dockerfile pins. With
        # runAsNonRoot and a NAMED image user the kubelet refuses to start the
        # container ("non-numeric user"), the same defect S-06 found in the
        # backend.
        runAsNonRoot: true
        runAsUser: {{ .Values.podSecurityContext.runAsUser }}
        runAsGroup: {{ .Values.podSecurityContext.runAsGroup }}
        fsGroup: {{ .Values.podSecurityContext.fsGroup }}
      containers:
        - name: frontend
          # NEXT_PUBLIC_* values are INLINED AT BUILD TIME. A different API
          # URL, or a tenant-pinned build (NEXT_PUBLIC_TENANT_ID), is a
          # DIFFERENT IMAGE — the tag is the only lever this chart has.
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
            # HOSTNAME, not HOST (S-30): Next standalone binds
            # process.env.HOSTNAME and ignores HOST. Set explicitly here rather
            # than trusting the image's ENV: container runtimes set HOSTNAME to
            # the container/pod name, and whether the image value survives is
            # the runtime's choice. Bound to the pod name, the server is
            # reachable through the Service and refused on localhost.
            - name: HOSTNAME
              value: "0.0.0.0"
            - name: PORT
              value: "3000"
            # The ingress routes /api to THIS service (Next owns the auth
            # cookie), and the Next proxy routes forward server-side to the
            # backend here. Unset, they fall back to NEXT_PUBLIC_API_BASE_URL —
            # the public origin — which re-enters the ingress and loops.
            # The backend Service name comes from the same helper that names it
            # (callibrator.baseName, S-27); 3000 is its default port.
            - name: BACKEND_INTERNAL_URL
              value: "http://{{ include "callibrator.baseName" . }}-backend:3000"

          # Both probes hit / — this server has no database dependency.
          #
          # A frontend that is healthy while the API is down is CORRECT: it
          # renders error states, which is the right behaviour.
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}

          resources:
            {{- toYaml .Values.resources | nindent 12 }}

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            # The image is Next standalone on Node (S-29), not a compiled Bun
            # binary. It writes only to .next/cache (image optimisation and
            # the ISR/fetch cache), which gets an emptyDir below, and /tmp.
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: next-cache
              mountPath: /app/frontend/.next/cache
      volumes:
        - name: tmp
          emptyDir: {}
        - name: next-cache
          emptyDir: {}
