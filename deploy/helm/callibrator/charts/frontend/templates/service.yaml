apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-callibrator-frontend
  labels:
    app.kubernetes.io/name: callibrator-frontend
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: web
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: callibrator-frontend
    app.kubernetes.io/instance: {{ .Release.Name }}
