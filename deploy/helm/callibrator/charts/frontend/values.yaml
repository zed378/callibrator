# Frontend subchart defaults.

replicaCount: 2

image:
  # Deployment-specific: built for one public URL (ADR-123); see the umbrella values.
  repository: zed378/calibration-fe
  # Required. The umbrella chart refuses to render without it.
  #
  # Remember: NEXT_PUBLIC_* values are inlined at build time. A different API
  # URL, or a tenant-pinned build, is a different image. The tag is the only
  # lever this chart has.
  tag: ""
  # Optional sha256:<64 hex>; rendered as repository:tag@digest (ADR-123).
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

# Must match the uid/gid frontend/Dockerfile pins (1001:1001).
podSecurityContext:
  runAsUser: 1001
  runAsGroup: 1001
  fsGroup: 1001

service:
  type: ClusterIP
  port: 3000

# Both probes hit / — no database dependency here. A frontend that is healthy
# while the API is down is correct: it renders error states.
probes:
  liveness:
    path: /
    initialDelaySeconds: 15
    periodSeconds: 20
  readiness:
    path: /
    initialDelaySeconds: 5
    periodSeconds: 10
  # P7-06: `/` is server-rendered — the kubelet default of 1s killed Next on a
  # busy node. The startup probe allows startupFailureThreshold x 5s to start.
  timeoutSeconds: 5
  startupFailureThreshold: 36

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi
