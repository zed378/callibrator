# Backend subchart defaults.
#
# The umbrella chart passes most of these down from its own values.yaml.
# Overriding them here directly is possible and usually not what you want.

replicaCount: 1

image:
  repository: callibrator/backend
  # Required. The umbrella chart refuses to render without it.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

# There is no secretName value (S-06). It defaulted to "callibrator-secrets",
# which the umbrella never set, so under most release names the backend named
# a Secret that did not exist. The Secret and ConfigMap names now come from the
# umbrella's helpers (callibrator.secretName / callibrator.configMapName), the
# same ones that create those objects. The umbrella refuses to render if
# backend.secretName is set.

# Must match the uid backend/Dockerfile pins (useradd -r -u 997).
podSecurityContext:
  runAsUser: 997
  runAsGroup: 997
  fsGroup: 997

service:
  type: ClusterIP
  port: 3000

# There is no mqtt value (S-22). The backend is an MQTT CLIENT of an external
# broker — set MQTT_HOST and MQTT_PORT in the environment to enable it; devices
# can also submit over HTTP (POST /api/v1/iot/ingest). No broker is embedded,
# so the chart publishes no 1883 port.

probes:
  # Liveness on /live (dependency-free), readiness on /health — /health
  # returns 503 ({"status":"unavailable"}) when PostgreSQL, Redis or RabbitMQ
  # is unreachable, and restarting on that turns a blip into a crash loop.
  liveness:
    path: /live
    initialDelaySeconds: 20
    periodSeconds: 20
  readiness:
    path: /health
    initialDelaySeconds: 10
    periodSeconds: 10
    failureThreshold: 3

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "2"
    # Chromium (certificate PDFs) is memory-hungry and bursty. A limit sized
    # for the steady state OOM-kills the pod on the first certificate.
    memory: 4Gi

persistence:
  # /app/uploads (attachments, quarantine) — local disk even with an s3
  # storage driver, because the attachment path does not use the storage
  # module — and, with storage.driver=local, /app/storage (S-18). ON by
  # default: off, every upload is lost on the next rollout.
  enabled: true
  size: 20Gi
  # Size of the /app/storage claim; defaults to `size`.
  objectsSize: ""
  storageClass: ""

# /app/backup — tenant backup ZIPs (S-18). The umbrella refuses to render
# cron.enabled without it: the scheduled backup would write to the container
# layer and be lost on the next rollout.
backupPersistence:
  enabled: true
  size: 50Gi
  storageClass: ""

# Read from the umbrella's backend.storage (the subchart sees backend.* as its
# own values); only `driver` is used here, to decide whether /app/storage
# needs a claim.
storage:
  driver: local

# Set by the umbrella chart to force a rollout when the ConfigMap changes.
configChecksum: ""
