apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-callibrator-backend
  labels:
    app.kubernetes.io/name: callibrator-backend
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: api
spec:
  type: {{ .Values.service.type }}
  # Socket.IO connections are long-lived. Session affinity is not a correctness
  # requirement once the Redis adapter is in place, but without it a client
  # reconnecting to a different replica loses nothing only because the client
  # refetches — see docs/FRONTEND/06-REALTIME.md.
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
    {{- if .Values.mqtt.enabled }}
    - name: mqtt
      port: 1883
      targetPort: mqtt
      protocol: TCP
    {{- end }}
  selector:
    app.kubernetes.io/name: callibrator-backend
    app.kubernetes.io/instance: {{ .Release.Name }}
---
{{- if .Values.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-callibrator-storage
  labels:
    app.kubernetes.io/name: callibrator-backend
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  # ReadWriteOnce is the common case and it is exactly why STORAGE_DRIVER=local
  # does not survive more than one replica: replica A writes an attachment,
  # replica B cannot serve it. Use s3 or nfs before scaling.
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
  {{- if .Values.persistence.storageClass }}
  storageClassName: {{ .Values.persistence.storageClass }}
  {{- end }}
{{- end }}
