apiVersion: v1
kind: Service
metadata:
  name: {{ include "callibrator.baseName" . }}-backend
  labels:
    app.kubernetes.io/name: callibrator-backend
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: api
spec:
  type: {{ .Values.service.type }}
  # Socket.IO connections are long-lived. Session affinity is not a correctness
  # requirement once the Redis adapter is in place, but without it a client
  # reconnecting to a different replica loses nothing only because the client
  # refetches — see docs/FRONTEND/06-REALTIME.md.
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
    # No MQTT port (S-22): the backend is an MQTT CLIENT of an external broker
    # (MQTT_HOST/MQTT_PORT); nothing listens on 1883 in this pod.
  selector:
    app.kubernetes.io/name: callibrator-backend
    app.kubernetes.io/instance: {{ .Release.Name }}
{{- define "callibrator.backend.pvc" -}}
{{- $root := index . 0 -}}
{{- $suffix := index . 1 -}}
{{- $size := index . 2 -}}
{{- $class := index . 3 -}}
{{- $why := index . 4 }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "callibrator.baseName" $root }}-{{ $suffix }}
  labels:
    app.kubernetes.io/name: callibrator-backend
    app.kubernetes.io/instance: {{ $root.Release.Name }}
  annotations:
    # A `helm uninstall` must not take tenant data with it.
    helm.sh/resource-policy: keep
    callibrator.io/holds: {{ $why | quote }}
spec:
  # ReadWriteOnce is the common case and it is exactly why local disk does not
  # survive more than one replica: replica A writes a file, replica B cannot
  # serve it. Use s3 or nfs, and shared (RWX) volumes, before scaling.
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ $size }}
  {{- if $class }}
  storageClassName: {{ $class }}
  {{- end }}
{{- end -}}
{{- if .Values.persistence.enabled }}
{{- include "callibrator.backend.pvc" (list . "storage" .Values.persistence.size .Values.persistence.storageClass "uploads (attachments, quarantine)") }}
{{- if eq (default "local" .Values.storage.driver) "local" }}
{{- include "callibrator.backend.pvc" (list . "objects" (default .Values.persistence.size .Values.persistence.objectsSize) .Values.persistence.storageClass "local storage-driver objects (/app/storage)") }}
{{- end }}
{{- end }}
{{- if .Values.backupPersistence.enabled }}
{{- include "callibrator.backend.pvc" (list . "backup" .Values.backupPersistence.size (default .Values.persistence.storageClass .Values.backupPersistence.storageClass) "tenant backups (/app/backup)") }}
{{- end }}
