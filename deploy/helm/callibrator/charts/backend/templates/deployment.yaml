apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "callibrator.baseName" . }}-backend
  labels:
    app.kubernetes.io/name: callibrator-backend
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: callibrator-backend
      app.kubernetes.io/instance: {{ .Release.Name }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: callibrator-backend
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: api
      annotations:
        # Restart on configuration change — otherwise a ConfigMap edit takes
        # effect at some unpredictable future restart.
        checksum/config: {{ .Values.configChecksum | default "" | quote }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        # The image creates a non-root `app` user and chowns its persistent
        # directories at build, because a non-root container cannot create
        # them at runtime.
        #
        # NUMERIC ids (S-06). The image's USER is the NAME `app`, and with
        # runAsNonRoot and no runAsUser the kubelet refuses the container
        # ("image has non-numeric user (app), cannot verify user is non-root").
        # 997 is the uid backend/Dockerfile pins (`useradd -r -u 997`); its
        # group is 997 on the bookworm-slim base (the gid is not pinned in the
        # Dockerfile). fsGroup was 1000, which matched nothing in the image.
        runAsNonRoot: true
        runAsUser: {{ .Values.podSecurityContext.runAsUser }}
        runAsGroup: {{ .Values.podSecurityContext.runAsGroup }}
        fsGroup: {{ .Values.podSecurityContext.fsGroup }}
      containers:
        - name: backend
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
            # No MQTT port (S-22). There is no embedded broker — no aedes server
            # exists in the codebase. The backend is an MQTT CLIENT of an
            # external broker (MQTT_HOST + MQTT_PORT); a chart value that
            # published 1883 here exposed a port with nothing behind it. A
            # sidecar broker, if ever added, publishes its own port.
          # Both names come from the umbrella's helpers (templates/_helpers.tpl),
          # the same ones that NAME the ConfigMap and Secret — so the reference
          # and the object cannot disagree under any release name (S-06, S-27).
          envFrom:
            - configMapRef:
                name: {{ include "callibrator.configMapName" . }}
            - secretRef:
                name: {{ include "callibrator.secretName" . }}

          # ------------------------------------------------------------------
          # Liveness gets /live. Readiness gets /health.
          #
          # /live is dependency-free. /health answers {"status":"ok"} or 503
          # {"status":"unavailable"} from probes of PostgreSQL, Redis and
          # RabbitMQ (A-06, A-15). Using it as a LIVENESS probe would restart a
          # healthy process during a datastore blip, turning a brief outage
          # into a crash loop. A pod failing readiness is correctly kept out of
          # rotation instead.
          # ------------------------------------------------------------------
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          # The application runs migrations at boot; give it room before the
          # liveness probe starts counting.
          startupProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: http
            failureThreshold: 30
            periodSeconds: 10

          resources:
            {{- toYaml .Values.resources | nindent 12 }}

          volumeMounts:
            {{- if .Values.persistence.enabled }}
            # Attachments and every other multer upload (uploads/, including
            # uploads/.quarantine — S-17). This path does not go through the
            # storage module, so it is local disk even with STORAGE_DRIVER=s3.
            - name: storage
              mountPath: /app/uploads
            {{- if eq (default "local" .Values.storage.driver) "local" }}
            # The `local` storage driver's root is <APP_STORAGE_PATH>/storage
            # (services/storage/config.service.js). Before S-18 the PVC covered
            # only /app/uploads, so pluggable-storage objects were written to
            # the container layer and lost on the next rollout. Its own claim,
            # not a subPath of the uploads one: a kubelet-created subPath
            # directory is root-owned and not writable by uid 997.
            - name: objects
              mountPath: /app/storage
            {{- end }}
            {{- end }}
            {{- if .Values.backupPersistence.enabled }}
            # Tenant backup ZIPs (services/tenantBackup.service.js BACKUP_DIR)
            # and last-scheduled-backup.json. Without a volume a backup is
            # written to the container layer and lost on the next rollout,
            # while its tenant_backups row still says `completed` (S-18).
            - name: backup
              mountPath: /app/backup
            {{- end }}
            # Logs AND the scheduled-job status files (log/jobs/*.json, P7-02).
            # emptyDir: production logs JSON to stdout, which the cluster's
            # log collector ships; the job status survives a container restart
            # but not a pod rescheduling — the alerts and metrics, not this
            # file, are the signal of record in-cluster.
            - name: logs
              mountPath: /app/log
            # ACME HTTP-01 challenge files are WRITTEN AT RUNTIME and served
            # from the writable storage root. A read-only path here produces
            # domain verification failures that look like DNS problems.
            # emptyDir on purpose: an HTTP-01 challenge lives for the minutes
            # of one validation, and a restart mid-validation just retries it.
            - name: wellknown
              mountPath: /app/.well-known

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            # NOT read-only: the app writes uploads, logs, ACME challenges and
            # tenant backups. Chromium also needs a writable temp directory.
            readOnlyRootFilesystem: false

      volumes:
        {{- if .Values.persistence.enabled }}
        - name: storage
          persistentVolumeClaim:
            claimName: {{ include "callibrator.baseName" . }}-storage
        {{- if eq (default "local" .Values.storage.driver) "local" }}
        - name: objects
          persistentVolumeClaim:
            claimName: {{ include "callibrator.baseName" . }}-objects
        {{- end }}
        {{- end }}
        {{- if .Values.backupPersistence.enabled }}
        - name: backup
          persistentVolumeClaim:
            claimName: {{ include "callibrator.baseName" . }}-backup
        {{- end }}
        - name: logs
          emptyDir: {}
        - name: wellknown
          emptyDir: {}
