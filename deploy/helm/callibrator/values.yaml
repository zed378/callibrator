# Callibrator — default values
#
# Overridden per environment by values-staging.yaml and values-prod.yaml.
#
# Configurations this chart REFUSES to render (see templates/guards.tpl):
#   1. a missing image.tag, or an image.digest that is not sha256:<64 hex>
#   2. cron.enabled with replicaCount > 1
#   3. a missing required secret (four of them) without an external Secret
#   4. NODE_ENV=production with no CORS origin
#   5. a value that moved and would otherwise be silently ignored
#   6. VIRUS_SCAN_PROVIDER=clamav with no backend.clamav.host (S-31)

global:
  # Explicit, comma-separated. A wildcard is never honoured: the CORS policy
  # runs with credentials:true, and reflecting an arbitrary origin would let
  # any site make authenticated cross-origin requests.
  corsOrigin: ""
  imagePullSecrets: []

  # Q-42 (ADR-113): the published privacy notice (an absolute https URL). Under
  # `global` because BOTH workloads read it, at runtime: the backend keeps
  # POST /api/v1/access-requests absent (404) while it is empty, and the
  # frontend shows "not open yet" on /request-access instead of the form and
  # omits the footer's privacy link. Empty until the owner publishes the notice.
  privacyNoticeUrl: ""

  # Every object in the release is named <base>-<component>, where <base> is
  # "<release>-callibrator", or just "<release>" when the release name already
  # contains "callibrator" — the SAME rule in the umbrella and both subcharts
  # (templates/_helpers.tpl, S-27). Set this to pin <base> explicitly.
  fullnameOverride: ""

  # The Secret the backend reads. Under `global` because the backend SUBCHART
  # must compute the same name the umbrella creates, and a subchart sees only
  # its own values and `global` (S-06). Prefer an external secrets operator:
  # set enabled=true and name the Secret it creates. That Secret must carry the
  # same keys templates/secret.yaml writes — all FOUR required ones included.
  secrets:
    external:
      enabled: false
      secretName: ""

# ============================================================================
# BACKEND
# ============================================================================
backend:
  enabled: true

  image:
    # ADR-123: the published image on Docker Hub (public). Override for a fork
    # or a private mirror (with global.imagePullSecrets).
    repository: zed378/calibration-be
    # REQUIRED. The chart fails to render without it — `:latest` in a cluster
    # means nobody can say what is running, and a rollback has nothing to roll
    # back to. Use the release's short commit, the tag
    # scripts/release/push-images.ps1 pushes beside `latest`.
    tag: ""
    # Optional: sha256:<64 hex>, printed by the release script. Rendered as
    # repository:tag@digest, so the digest decides what runs even if the tag
    # is re-pushed. Empty = the tag alone.
    digest: ""
    pullPolicy: IfNotPresent

  replicaCount: 1

  # Scheduled jobs: session cleanup, tenant backup, data-retention purge, the
  # calibration sweep.
  #
  # A cron job installed in every replica RUNS ONCE PER REPLICA. Two replicas
  # means every backup runs twice and every purge runs twice. The chart
  # refuses to render cron.enabled with replicaCount > 1.
  #
  # The intended shape: one single-replica deployment with cron.enabled true,
  # and the API deployment scaled with cron.enabled false.
  cron:
    enabled: true
    sessionCleanup: "0 2 * * *"
    backup: "0 3 * * 0"
    retention: "0 2 * * *"
    # Empty = the application default (calibration 01:00 daily, tenant
    # lifecycle 02:30 daily, quarantine sweep hourly at :17, the SQL-dump
    # import's sweep hourly at :41).
    calibration: ""
    tenantLifecycle: ""
    quarantineSweep: ""
    upstreamSqlImportSweep: ""

  service:
    type: ClusterIP
    port: 3000

  # Liveness gets /live, readiness gets /health (S-21).
  #
  # /live is dependency-free: 200 "OK" whenever the process can serve.
  # /health answers {"status":"ok"} (200) or {"status":"unavailable"} (503)
  # from probes of PostgreSQL, Redis and RabbitMQ — a verdict only, with no
  # dependency named (the breakdown is GET /api/v1/health, super admin only).
  # Using /health as a LIVENESS probe would restart a healthy process during a
  # datastore blip, turning a brief outage into a crash loop.
  probes:
    liveness:
      path: /live
      initialDelaySeconds: 20
      periodSeconds: 20
    readiness:
      path: /health
      initialDelaySeconds: 10
      periodSeconds: 10
      failureThreshold: 3

  resources:
    requests:
      cpu: 250m
      memory: 384Mi
    limits:
      cpu: "2"
      # ADR-095 follow-up (2026-09-30): re-sized to measured need. The backend image has no
      # Chromium; measured on callibrator/backend:adr095f under boot + migrations, seeding, three
      # live E2E runs (two concurrent) and six browser-smoke runs: cgroup memory.peak 306 MiB, Node
      # VmHWM 337 MiB, steady 215-265 MiB (MEMORY/records/2026-09-30-adr095-followups.md). Not
      # production traffic: re-measure under a real tenant's exports/reports before tightening
      # further. 1Gi is 3x the measured peak; the request is the measured steady state plus margin.
      memory: 1Gi

  env:
    NODE_ENV: production
    APP_STORAGE_PATH: /app
    FORCE_HTTPS: "true"
    # Must be empty outside development.
    BATCH_JOBS_INLINE: ""
    SEED_DEMO: ""
    # First-boot seeding toggle (P7-06). "true" opens GET /api/v1/migration/
    # seeding WITHOUT authentication, for the one upgrade that seeds an empty
    # database; set it back to "" straight after — NOTES.txt warns while set.
    ALLOW_SEEDING: ""
    VIRUS_SCAN_PROVIDER: clamav
    VIRUS_SCAN_FAIL_OPEN: "false"

  # ClamAV (clamd) — provided EXTERNALLY, like PostgreSQL. This chart runs no
  # ClamAV service (S-31). With VIRUS_SCAN_PROVIDER=clamav the ConfigMap sets
  # CLAMAV_ENABLED=true and points CLAMAV_HOST/PORT here; since S-04 a clamav
  # provider WITHOUT CLAMAV_ENABLED refuses every upload (422). The chart
  # refuses to render the clamav provider with an empty host (guard 6).
  clamav:
    host: ""
    port: 3310

  # local storage is INCOMPATIBLE with replicaCount > 1 — replica A writes an
  # attachment, replica B cannot serve it. The chart does NOT guard this.
  storage:
    driver: local
    s3:
      bucket: ""
      region: ""
      endpoint: ""
      forcePathStyle: true
      # Leave the key pair unset to use the ambient credential chain (IAM
      # role via a service account), which beats static keys in a Secret.
      accessKeyId: ""
      secretAccessKey: ""

  # Provided externally. Running a database from this chart couples lifecycles.
  database:
    host: ""
    port: 5432
    name: callibrator
    user: callibrator
    dialect: postgres
    ssl: false
    # P6-03 → DB_APP_ROLE. The same default as the backend and migration
    # 0057. Migration 0057 creates it when `user` has CREATEROLE (or is a
    # superuser); on a managed database without that, create it once as an
    # administrator: CREATE ROLE callibrator_app NOLOGIN;
    # GRANT callibrator_app TO <user>;  — or set "none" to run as the owner.
    appRole: callibrator_app
    # PostgreSQL must have pgvector: migration 0018 runs
    # `CREATE EXTENSION vector` and plain Postgres fails it.
    # U-06b (ADR-120): migration 0110 runs `CREATE EXTENSION IF NOT EXISTS
    # btree_gin` (contrib, a trusted extension): the database OWNER can create
    # it without being a superuser. A `user` that is not the owner and lacks
    # CREATE on the database fails 0110 with "permission denied to create
    # extension" and the backend does not start; create it once as the owner
    # or an administrator: CREATE EXTENSION btree_gin;

  redis:
    url: ""

  rabbitmq:
    url: ""

  # /app/uploads — the upload quarantine, and the files written before P8-01
  # (legacy attachments, certificate PDFs, public images) until
  # `migrate:storage` copies them. Since P8-01 (ADR-086 Amendment 1) every
  # stored file goes through STORAGE_DRIVER. With storage.driver=local a
  # second claim covers the driver's root, /app/storage (S-18) — where every
  # new file then lives. ON by default, and the chart refuses
  # NODE_ENV=production with it off (guard 8): every upload would be lost on
  # the next rollout. Each claim carries helm.sh/resource-policy: keep.
  persistence:
    enabled: true
    size: 20Gi
    objectsSize: ""
    storageClass: ""

  # /app/backup — tenant backup ZIPs and last-scheduled-backup.json (S-18).
  # The chart refuses cron.enabled without it (guard 7).
  backupPersistence:
    enabled: true
    size: 50Gi
    storageClass: ""

# ============================================================================
# BACKUP VERIFICATION (U-05, ADR-116)
# ============================================================================
# A CronJob that dumps the external database (pg_dump -Fc, in an exported
# snapshot) onto its own claim and RESTORES EVERY DUMP into a throwaway
# PostgreSQL 18 + pgvector inside the pod, then checks it (exact row counts,
# audit checksum, pgvector, the application's schema check). A failure alerts
# through ALERT_WEBHOOK_URL / ALERT_EMAIL_TO and fails the Job. OFF by default
# only by choice: the image is published with every release
# (zed378/calibration-backup, built FROM the backend image of the same tag by
# scripts/release/push-images.ps1, ADR-123).
# A managed database's own snapshots/PITR are a separate layer; this is the one
# that proves a restore WORKS. Alert on kube_job_status_failed for this CronJob
# and on kube_cronjob_status_last_successful_time older than ~26 h.
backupVerify:
  enabled: false
  image:
    repository: zed378/calibration-backup
    # Empty = backend.image.tag. The binary inside must match the schema it checks.
    tag: ""
    # Optional sha256:<64 hex> of THIS image (not the backend's). Empty = the tag.
    digest: ""
    pullPolicy: IfNotPresent
  schedule: "30 2 * * *"
  # CronJob .spec.timeZone (Kubernetes >= 1.27) and the pod's TZ. Empty = UTC.
  timeZone: ""
  startingDeadlineSeconds: 3600
  # Kill a run that takes longer than this (the Job fails, which alerts).
  activeDeadlineSeconds: 14400
  # Dumps kept on the claim; the newest VERIFIED one is kept whatever its age.
  keep: 14
  persistence:
    # Room for `keep` dumps. Keeps on uninstall (helm.sh/resource-policy: keep).
    size: 100Gi
    storageClass: ""
  # The throwaway server's data directory (an emptyDir): room for ONE restored copy.
  scratchSizeLimit: 50Gi
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi
  # Egress (with networkPolicy.enabled): the database, the alert webhook, SMTP.
  egressPorts:
    - { port: 5432, protocol: TCP }
    - { port: 443, protocol: TCP }
    - { port: 587, protocol: TCP }
    - { port: 465, protocol: TCP }

# ============================================================================
# NETWORK POLICY (S-18)
# ============================================================================
# Default-deny for this release's pods, then exactly the flows the application
# uses. Enforced and probed on a kind cluster (kindnet, P7-06, 2026-09-30):
# 16 of 16 allow/deny flows as intended — see MEMORY/records/. A
# NetworkPolicy that is wrong fails CLOSED (the pod cannot reach its database),
# so the first install on a real CNI must still check every flow below.
# Requires a CNI that enforces NetworkPolicy (Calico, Cilium, …); on one that
# does not, these objects are accepted and do nothing.
networkPolicy:
  enabled: true
  # Who may reach the frontend and the backend's public paths (/socket.io,
  # /oidc, /.well-known, /uploads, /health): the ingress controller's pods.
  ingressController:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: ingress-nginx
    podSelector: {}
  # Extra sources allowed to reach the backend (e.g. a Prometheus namespace
  # scraping /api/v1/health/metrics). NetworkPolicyPeer objects.
  extraBackendIngressFrom: []
  # Backend egress by PORT, to any destination: PostgreSQL, Redis, RabbitMQ
  # and clamd are external to this chart, so there is no selector it could
  # know. Narrow with `backendEgressTo` (NetworkPolicyPeers, e.g. ipBlocks of
  # the datastore subnets) when you can.
  backendEgressPorts:
    - { port: 5432, protocol: TCP }   # PostgreSQL
    - { port: 6379, protocol: TCP }   # Redis
    - { port: 5672, protocol: TCP }   # RabbitMQ (AMQP)
    - { port: 3310, protocol: TCP }   # clamd
    - { port: 587, protocol: TCP }    # SMTP submission
    - { port: 465, protocol: TCP }    # SMTPS
    - { port: 443, protocol: TCP }    # S3, OIDC/SAML IdPs, webhooks, ACME, AI API, alert webhook
    - { port: 80, protocol: TCP }     # ACME HTTP, plain-HTTP webhook receivers
  backendEgressTo: []
  # MQTT, only when the backend is an MQTT client (MQTT_HOST/MQTT_PORT).
  mqttEgressPorts: []

# ============================================================================
# POD DISRUPTION BUDGETS (S-18)
# ============================================================================
# Rendered for a component only when its replicaCount > 1 — a PDB on a single
# replica either blocks every node drain (minAvailable 1) or protects nothing.
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# ============================================================================
# FRONTEND
# ============================================================================
frontend:
  enabled: true

  image:
    # ADR-123: the published image on Docker Hub — but DEPLOYMENT-SPECIFIC.
    # NEXT_PUBLIC_* values are INLINED AT BUILD TIME, and zed378/calibration-fe
    # is built for the reference deployment (https://kalibrasi.zedth.my.id). A
    # cluster served at any other URL needs its own frontend image: push one
    # with scripts/release/push-images.ps1 -PublicUrl <url> -Repository <yours>
    # and set this repository. This chart cannot configure them at runtime.
    repository: zed378/calibration-fe
    # REQUIRED, same rule as the backend.
    tag: ""
    # Optional sha256:<64 hex>; same rule as the backend.
    digest: ""
    pullPolicy: IfNotPresent

  replicaCount: 2

  service:
    type: ClusterIP
    port: 3000

  probes:
    liveness:
      path: /
      initialDelaySeconds: 15
      periodSeconds: 20
    readiness:
      path: /
      initialDelaySeconds: 5
      periodSeconds: 10

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

# ============================================================================
# INGRESS
# ============================================================================
ingress:
  enabled: true
  className: nginx
  host: callibrator.example.com

  annotations:
    # Socket.IO needs WebSocket support. Without it, it SILENTLY falls back to
    # long-polling — which works until connection counts matter.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    # Match the application's 10 MB body limit.
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"

  tls:
    enabled: true
    secretName: callibrator-tls

# ============================================================================
# SECRETS
# ============================================================================
# Chart-managed Secret values, used only when global.secrets.external.enabled
# is false. FOUR are REQUIRED — the application EXITS without them, and the
# chart refuses to render without them (guard 3): certSigningSecret,
# encryptKey, attachmentUrlSecret, kmsMasterKey.
#
# BACK UP certSigningSecret, encryptKey AND kmsMasterKey SEPARATELY FROM THE
# CLUSTER AND FROM THE DATABASE. A rebuild that recreates everything except
# these produces a system that starts cleanly and is permanently broken: every
# issued certificate fails public verification, and every wrapped credential is
# undecryptable.
#
# (The external-Secret switch moved to global.secrets.external — S-06. Setting
# secrets.external here now refuses to render rather than being ignored.)
secrets:
  # Inline values are for development only. Never commit real ones.
  certSigningSecret: ""
  encryptKey: ""
  attachmentUrlSecret: ""
  # KMS_MASTER_KEY (S-05): 64 hex chars. backend/src/services/kms.service.js
  # throws at startup in production without it, and the pod crash-loops (the
  # error is on stdout since A-14 — `kubectl logs`).
  kmsMasterKey: ""
  jwtAccessSecret: ""
  # MUST differ from jwtAccessSecret — equal secrets mean an access token can
  # be presented as a refresh token.
  jwtRefreshSecret: ""
  dbPassword: ""
  mailPassword: ""
  # S-09: Redis requirepass/ACL password -> REDIS_PASSWORD. Keep backend.redis.url
  # credential-free; the chart refuses a URL with user:password@ (guard 9).
  redisPassword: ""
  # S-09: the full amqp://user:pass@host:5672 URL, when the broker has
  # credentials (it should). Overrides backend.rabbitmq.url.
  rabbitmqUrl: ""
  # P7-02: incoming-webhook URL for alerts (Slack, Mattermost, Teams, …).
  alertWebhookUrl: ""
  # P7-02: bearer token for /api/v1/health/metrics; >= 32 characters.
  metricsToken: ""
  stripeSecretKey: ""
  stripeWebhookSecret: ""
  openaiApiKey: ""

# ============================================================================
# ALERTS (P7-02)
# ============================================================================
# Every scheduled-job failure, missed run and stuck batch job is logged at
# `error` with an `alert.key` field — ship the logs and alert on that. These
# add push channels. The webhook URL is secrets.alertWebhookUrl.
alerts:
  emailTo: ""

# ============================================================================
# CERTIFICATES / ACME
# ============================================================================
certificates:
  verifyBaseUrl: ""
  acme:
    # ADR-081: `enabled` sets CUSTOM_DOMAINS_ENABLED (tenant domain
    # registration and DNS verification) and nothing else. No certificate is
    # issued automatically (A-256; acme-client removed, ADR-076):
    # directoryUrl and accountEmail are NOT rendered and NOT read. They are
    # kept so an existing override still renders.
    enabled: false
    directoryUrl: ""
    accountEmail: ""
