# Callibrator — default values
#
# Overridden per environment by values-staging.yaml and values-prod.yaml.
#
# Configurations this chart REFUSES to render (see templates/guards.tpl):
#   1. a missing image.tag
#   2. cron.enabled with replicaCount > 1
#   3. a missing required secret (four of them) without an external Secret
#   4. NODE_ENV=production with no CORS origin
#   5. a value that moved and would otherwise be silently ignored
#   6. VIRUS_SCAN_PROVIDER=clamav with no backend.clamav.host (S-31)

global:
  # Explicit, comma-separated. A wildcard is never honoured: the CORS policy
  # runs with credentials:true, and reflecting an arbitrary origin would let
  # any site make authenticated cross-origin requests.
  corsOrigin: ""
  imagePullSecrets: []

  # Every object in the release is named <base>-<component>, where <base> is
  # "<release>-callibrator", or just "<release>" when the release name already
  # contains "callibrator" — the SAME rule in the umbrella and both subcharts
  # (templates/_helpers.tpl, S-27). Set this to pin <base> explicitly.
  fullnameOverride: ""

  # The Secret the backend reads. Under `global` because the backend SUBCHART
  # must compute the same name the umbrella creates, and a subchart sees only
  # its own values and `global` (S-06). Prefer an external secrets operator:
  # set enabled=true and name the Secret it creates. That Secret must carry the
  # same keys templates/secret.yaml writes — all FOUR required ones included.
  secrets:
    external:
      enabled: false
      secretName: ""

# ============================================================================
# BACKEND
# ============================================================================
backend:
  enabled: true

  image:
    repository: callibrator/backend
    # REQUIRED. The chart fails to render without it — `:latest` in a cluster
    # means nobody can say what is running, and a rollback has nothing to roll
    # back to.
    tag: ""
    pullPolicy: IfNotPresent

  replicaCount: 1

  # Scheduled jobs: session cleanup, tenant backup, data-retention purge, the
  # calibration sweep.
  #
  # A cron job installed in every replica RUNS ONCE PER REPLICA. Two replicas
  # means every backup runs twice and every purge runs twice. The chart
  # refuses to render cron.enabled with replicaCount > 1.
  #
  # The intended shape: one single-replica deployment with cron.enabled true,
  # and the API deployment scaled with cron.enabled false.
  cron:
    enabled: true
    sessionCleanup: "0 2 * * *"
    backup: "0 3 * * 0"
    retention: "0 2 * * *"
    # Empty = the application default (calibration 01:00 daily, tenant
    # lifecycle 02:30 daily, quarantine sweep hourly at :17).
    calibration: ""
    tenantLifecycle: ""
    quarantineSweep: ""

  service:
    type: ClusterIP
    port: 3000

  # Liveness gets /live, readiness gets /health (S-21).
  #
  # /live is dependency-free: 200 "OK" whenever the process can serve.
  # /health answers {"status":"ok"} (200) or {"status":"unavailable"} (503)
  # from probes of PostgreSQL, Redis and RabbitMQ — a verdict only, with no
  # dependency named (the breakdown is GET /api/v1/health, super admin only).
  # Using /health as a LIVENESS probe would restart a healthy process during a
  # datastore blip, turning a brief outage into a crash loop.
  probes:
    liveness:
      path: /live
      initialDelaySeconds: 20
      periodSeconds: 20
    readiness:
      path: /health
      initialDelaySeconds: 10
      periodSeconds: 10
      failureThreshold: 3

  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "2"
      # Chromium (certificate PDFs) is memory-hungry and bursty. A limit sized
      # for the steady state will OOM-kill the pod on the first certificate.
      memory: 4Gi

  env:
    NODE_ENV: production
    APP_STORAGE_PATH: /app
    PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium
    FORCE_HTTPS: "true"
    # Must be empty outside development.
    BATCH_JOBS_INLINE: ""
    SEED_DEMO: ""
    VIRUS_SCAN_PROVIDER: clamav
    VIRUS_SCAN_FAIL_OPEN: "false"

  # ClamAV (clamd) — provided EXTERNALLY, like PostgreSQL. This chart runs no
  # ClamAV service (S-31). With VIRUS_SCAN_PROVIDER=clamav the ConfigMap sets
  # CLAMAV_ENABLED=true and points CLAMAV_HOST/PORT here; since S-04 a clamav
  # provider WITHOUT CLAMAV_ENABLED refuses every upload (422). The chart
  # refuses to render the clamav provider with an empty host (guard 6).
  clamav:
    host: ""
    port: 3310

  # local storage is INCOMPATIBLE with replicaCount > 1 — replica A writes an
  # attachment, replica B cannot serve it. The chart does NOT guard this.
  storage:
    driver: local
    s3:
      bucket: ""
      region: ""
      endpoint: ""
      forcePathStyle: true
      # Leave the key pair unset to use the ambient credential chain (IAM
      # role via a service account), which beats static keys in a Secret.
      accessKeyId: ""
      secretAccessKey: ""

  # Provided externally. Running a database from this chart couples lifecycles.
  database:
    host: ""
    port: 5432
    name: callibrator
    user: callibrator
    dialect: postgres
    ssl: false
    # P6-03 → DB_APP_ROLE. The same default as the backend and migration
    # 0057. Migration 0057 creates it when `user` has CREATEROLE (or is a
    # superuser); on a managed database without that, create it once as an
    # administrator: CREATE ROLE callibrator_app NOLOGIN;
    # GRANT callibrator_app TO <user>;  — or set "none" to run as the owner.
    appRole: callibrator_app
    # PostgreSQL must have pgvector: migration 0018 runs
    # `CREATE EXTENSION vector` and plain Postgres fails it.

  redis:
    url: ""

  rabbitmq:
    url: ""

  # /app/uploads — attachments and the upload quarantine. NOT only for the
  # local storage driver: the attachment path writes local disk whatever
  # STORAGE_DRIVER says. With storage.driver=local a second claim covers the
  # driver's root, /app/storage (S-18). ON by default, and the chart refuses
  # NODE_ENV=production with it off (guard 8): every upload would be lost on
  # the next rollout. Each claim carries helm.sh/resource-policy: keep.
  persistence:
    enabled: true
    size: 20Gi
    objectsSize: ""
    storageClass: ""

  # /app/backup — tenant backup ZIPs and last-scheduled-backup.json (S-18).
  # The chart refuses cron.enabled without it (guard 7).
  backupPersistence:
    enabled: true
    size: 50Gi
    storageClass: ""

# ============================================================================
# NETWORK POLICY (S-18)
# ============================================================================
# Default-deny for this release's pods, then exactly the flows the application
# uses. RENDERS ONLY — like the rest of this chart it has not been applied to a
# cluster (P7-06). A NetworkPolicy that is wrong fails CLOSED (the pod cannot
# reach its database), so the first install must check every flow below.
# Requires a CNI that enforces NetworkPolicy (Calico, Cilium, …); on one that
# does not, these objects are accepted and do nothing.
networkPolicy:
  enabled: true
  # Who may reach the frontend and the backend's public paths (/socket.io,
  # /oidc, /.well-known, /uploads, /health): the ingress controller's pods.
  ingressController:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: ingress-nginx
    podSelector: {}
  # Extra sources allowed to reach the backend (e.g. a Prometheus namespace
  # scraping /api/v1/health/metrics). NetworkPolicyPeer objects.
  extraBackendIngressFrom: []
  # Backend egress by PORT, to any destination: PostgreSQL, Redis, RabbitMQ
  # and clamd are external to this chart, so there is no selector it could
  # know. Narrow with `backendEgressTo` (NetworkPolicyPeers, e.g. ipBlocks of
  # the datastore subnets) when you can.
  backendEgressPorts:
    - { port: 5432, protocol: TCP }   # PostgreSQL
    - { port: 6379, protocol: TCP }   # Redis
    - { port: 5672, protocol: TCP }   # RabbitMQ (AMQP)
    - { port: 3310, protocol: TCP }   # clamd
    - { port: 587, protocol: TCP }    # SMTP submission
    - { port: 465, protocol: TCP }    # SMTPS
    - { port: 443, protocol: TCP }    # S3, OIDC/SAML IdPs, webhooks, ACME, AI API, alert webhook
    - { port: 80, protocol: TCP }     # ACME HTTP, plain-HTTP webhook receivers
  backendEgressTo: []
  # MQTT, only when the backend is an MQTT client (MQTT_HOST/MQTT_PORT).
  mqttEgressPorts: []

# ============================================================================
# POD DISRUPTION BUDGETS (S-18)
# ============================================================================
# Rendered for a component only when its replicaCount > 1 — a PDB on a single
# replica either blocks every node drain (minAvailable 1) or protects nothing.
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# ============================================================================
# FRONTEND
# ============================================================================
frontend:
  enabled: true

  image:
    repository: callibrator/frontend
    # REQUIRED, same rule as the backend.
    #
    # Note: NEXT_PUBLIC_* values are INLINED AT BUILD TIME. A different API
    # URL, or a tenant-pinned build, requires a DIFFERENT IMAGE. This chart
    # cannot configure them at runtime.
    tag: ""
    pullPolicy: IfNotPresent

  replicaCount: 2

  service:
    type: ClusterIP
    port: 3000

  probes:
    liveness:
      path: /
      initialDelaySeconds: 15
      periodSeconds: 20
    readiness:
      path: /
      initialDelaySeconds: 5
      periodSeconds: 10

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

# ============================================================================
# INGRESS
# ============================================================================
ingress:
  enabled: true
  className: nginx
  host: callibrator.example.com

  annotations:
    # Socket.IO needs WebSocket support. Without it, it SILENTLY falls back to
    # long-polling — which works until connection counts matter.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    # Match the application's 10 MB body limit.
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"

  tls:
    enabled: true
    secretName: callibrator-tls

# ============================================================================
# SECRETS
# ============================================================================
# Chart-managed Secret values, used only when global.secrets.external.enabled
# is false. FOUR are REQUIRED — the application EXITS without them, and the
# chart refuses to render without them (guard 3): certSigningSecret,
# encryptKey, attachmentUrlSecret, kmsMasterKey.
#
# BACK UP certSigningSecret, encryptKey AND kmsMasterKey SEPARATELY FROM THE
# CLUSTER AND FROM THE DATABASE. A rebuild that recreates everything except
# these produces a system that starts cleanly and is permanently broken: every
# issued certificate fails public verification, and every wrapped credential is
# undecryptable.
#
# (The external-Secret switch moved to global.secrets.external — S-06. Setting
# secrets.external here now refuses to render rather than being ignored.)
secrets:
  # Inline values are for development only. Never commit real ones.
  certSigningSecret: ""
  encryptKey: ""
  attachmentUrlSecret: ""
  # KMS_MASTER_KEY (S-05): 64 hex chars. backend/src/services/kms.service.js
  # throws at startup in production without it, and the pod crash-loops (the
  # error is on stdout since A-14 — `kubectl logs`).
  kmsMasterKey: ""
  jwtAccessSecret: ""
  # MUST differ from jwtAccessSecret — equal secrets mean an access token can
  # be presented as a refresh token.
  jwtRefreshSecret: ""
  dbPassword: ""
  mailPassword: ""
  # S-09: Redis requirepass/ACL password -> REDIS_PASSWORD. Keep backend.redis.url
  # credential-free; the chart refuses a URL with user:password@ (guard 9).
  redisPassword: ""
  # S-09: the full amqp://user:pass@host:5672 URL, when the broker has
  # credentials (it should). Overrides backend.rabbitmq.url.
  rabbitmqUrl: ""
  # P7-02: incoming-webhook URL for alerts (Slack, Mattermost, Teams, …).
  alertWebhookUrl: ""
  # P7-02: bearer token for /api/v1/health/metrics; >= 32 characters.
  metricsToken: ""
  stripeSecretKey: ""
  stripeWebhookSecret: ""
  openaiApiKey: ""

# ============================================================================
# ALERTS (P7-02)
# ============================================================================
# Every scheduled-job failure, missed run and stuck batch job is logged at
# `error` with an `alert.key` field — ship the logs and alert on that. These
# add push channels. The webhook URL is secrets.alertWebhookUrl.
alerts:
  emailTo: ""

# ============================================================================
# CERTIFICATES / ACME
# ============================================================================
certificates:
  verifyBaseUrl: ""
  acme:
    enabled: false
    # DEFAULTS TO THE LET'S ENCRYPT STAGING DIRECTORY. Forgetting to point this
    # at production yields certificates no browser trusts, and the failure
    # appears in a browser rather than in any log.
    directoryUrl: "https://acme-staging-v02.api.letsencrypt.org/directory"
    accountEmail: ""
