{{- if not (include "callibrator.externalSecrets" .) }}
{{- include "callibrator.guards" . -}}
# Chart-managed Secret.
#
# Prefer global.secrets.external.enabled with a secrets operator. Inline values
# live in a values file, and a values file ends up in version control. An
# external Secret must carry the same keys as this one — all FOUR required.
#
# KMS_MASTER_KEY and ENCRYPT_KEY must be BACKED UP SEPARATELY from the cluster
# and from the database (S-08, P6-10). KMS_MASTER_KEY wraps every tenant secret
# at rest — tenant_settings credentials, webhook secrets and, since migration
# 0058, the tenant e-signature private keys. ENCRYPT_KEY is LEGACY: it wrapped
# those private keys before 0058 and is read only for a row restored from an
# older backup. A rebuild that loses KMS_MASTER_KEY starts cleanly and cannot
# decrypt a single stored secret. CERT_SIGNING_SECRET keys only short-lived
# links; no issued certificate depends on it (A-241).
#
# All of them are ROTATABLE: KMS_MASTER_KEY with KMS_MASTER_KEY_PREVIOUS and
# `npm run keys:rotate`; the JWT access key with JWT_ACCESS_SECRET_PREVIOUS /
# JWT_PUBLIC_KEY_PREVIOUS. This chart has no fields for the *_PREVIOUS values
# yet — supply them through global.secrets.external during a rotation.
# Procedure: docs/SECURITY/13-KEY-ROTATION.md.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "callibrator.secretName" . }}
  labels:
    {{- include "callibrator.labels" . | nindent 4 }}
type: Opaque
stringData:
  # --- required: the application EXITS without these ---
  CERT_SIGNING_SECRET: {{ .Values.secrets.certSigningSecret | quote }}
  ENCRYPT_KEY: {{ .Values.secrets.encryptKey | quote }}
  ATTACHMENT_URL_SECRET: {{ .Values.secrets.attachmentUrlSecret | quote }}
  # The fourth (S-05). backend/src/services/kms.service.js THROWS AT REQUIRE
  # TIME in production without it — and production writes nothing to stdout, so
  # the pod crash-loops with EMPTY logs. Guard 3 refuses to render without it.
  KMS_MASTER_KEY: {{ .Values.secrets.kmsMasterKey | quote }}

  # --- tokens: these two MUST DIFFER (guard 3 enforces it) ---
  JWT_ACCESS_SECRET: {{ .Values.secrets.jwtAccessSecret | quote }}
  JWT_REFRESH_SECRET: {{ .Values.secrets.jwtRefreshSecret | quote }}

  # --- infrastructure ---
  DB_PASS: {{ .Values.secrets.dbPassword | quote }}
  # S-09: Redis `requirepass` / ACL password (the backend sends AUTH when set),
  # and a RabbitMQ URL that carries credentials. Both stay out of the
  # ConfigMap (guard 9).
  {{- if .Values.secrets.redisPassword }}
  REDIS_PASSWORD: {{ .Values.secrets.redisPassword | quote }}
  {{- end }}
  {{- if .Values.secrets.rabbitmqUrl }}
  RABBITMQ_URL: {{ .Values.secrets.rabbitmqUrl | quote }}
  {{- end }}
  # P7-02: a chat webhook URL is a bearer credential.
  {{- if .Values.secrets.alertWebhookUrl }}
  ALERT_WEBHOOK_URL: {{ .Values.secrets.alertWebhookUrl | quote }}
  {{- end }}
  # P7-02: bearer token for GET /api/v1/health/metrics (>= 32 chars; unset = off).
  {{- if .Values.secrets.metricsToken }}
  METRICS_TOKEN: {{ .Values.secrets.metricsToken | quote }}
  {{- end }}
  {{- if .Values.secrets.mailPassword }}
  MAIL_PASSWORD: {{ .Values.secrets.mailPassword | quote }}
  {{- end }}

  # --- providers ---
  #
  # A LIVE Stripe key with NODE_ENV != production passes every per-field check
  # and will charge a real card from a test. The reverse — a sandbox key in
  # production — makes every order look paid while no money arrives, and
  # nothing errors. Only a cross-field rule catches either.
  {{- if .Values.secrets.stripeSecretKey }}
  STRIPE_SECRET_KEY: {{ .Values.secrets.stripeSecretKey | quote }}
  {{- end }}
  {{- if .Values.secrets.stripeWebhookSecret }}
  STRIPE_WEBHOOK_SECRET: {{ .Values.secrets.stripeWebhookSecret | quote }}
  {{- end }}
  {{- if .Values.secrets.openaiApiKey }}
  OPENAI_API_KEY: {{ .Values.secrets.openaiApiKey | quote }}
  {{- end }}

  # --- object storage ---
  #
  # Prefer leaving these unset and using the ambient credential chain via a
  # service account (IRSA / Workload Identity). Static keys in a Secret are
  # strictly worse.
  {{- if .Values.backend.storage.s3.accessKeyId }}
  STORAGE_S3_ACCESS_KEY_ID: {{ .Values.backend.storage.s3.accessKeyId | quote }}
  STORAGE_S3_SECRET_ACCESS_KEY: {{ .Values.backend.storage.s3.secretAccessKey | quote }}
  {{- end }}
{{- end }}
