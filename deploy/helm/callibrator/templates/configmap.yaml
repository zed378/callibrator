{{- include "callibrator.guards" . -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "callibrator.configMapName" . }}
  labels:
    {{- include "callibrator.labels" . | nindent 4 }}
data:
  # ------------------------------------------------------------------------
  # Application
  # ------------------------------------------------------------------------
  NODE_ENV: {{ .Values.backend.env.NODE_ENV | quote }}
  APP_STORAGE_PATH: {{ .Values.backend.env.APP_STORAGE_PATH | quote }}
  # The compiled binary cannot use puppeteer's bundled Chromium. Wrong or
  # unset, PDF rendering fails at FIRST USE rather than at startup — a late
  # failure in a compliance-critical path.
  PUPPETEER_EXECUTABLE_PATH: {{ .Values.backend.env.PUPPETEER_EXECUTABLE_PATH | quote }}
  FORCE_HTTPS: {{ .Values.backend.env.FORCE_HTTPS | quote }}
  # Explicit, comma-separated. A wildcard is never honoured.
  CORS_ORIGIN: {{ .Values.global.corsOrigin | quote }}
  HOST_URL: {{ printf "https://%s" .Values.ingress.host | quote }}

  # Empty outside development. Inline mode makes a batch job synchronous with
  # whatever triggered it, reintroducing the 30s timeout it exists to avoid.
  BATCH_JOBS_INLINE: {{ .Values.backend.env.BATCH_JOBS_INLINE | quote }}
  # A demo seeder against real data is a data-integrity incident.
  SEED_DEMO: {{ .Values.backend.env.SEED_DEMO | quote }}

  # ------------------------------------------------------------------------
  # Database — provided externally. PostgreSQL must have pgvector: migration
  # 0018 runs `CREATE EXTENSION vector` and plain Postgres fails it.
  # ------------------------------------------------------------------------
  DB_HOST: {{ .Values.backend.database.host | quote }}
  DB_PORT: {{ .Values.backend.database.port | quote }}
  DB_NAME: {{ .Values.backend.database.name | quote }}
  DB_USER: {{ .Values.backend.database.user | quote }}
  DB_DIALECT: {{ .Values.backend.database.dialect | quote }}
  DB_SSL: {{ .Values.backend.database.ssl | quote }}

  # Credential-free by rule (guard 9, S-09): the Redis password is
  # REDIS_PASSWORD and a credentialed RabbitMQ URL is RABBITMQ_URL, both in the
  # Secret. When secrets.rabbitmqUrl is set, the Secret's RABBITMQ_URL is the
  # one the pod sees (envFrom: the Secret is listed after the ConfigMap).
  REDIS_URL: {{ .Values.backend.redis.url | quote }}
  {{- if not .Values.secrets.rabbitmqUrl }}
  RABBITMQ_URL: {{ .Values.backend.rabbitmq.url | quote }}
  {{- end }}

  # ------------------------------------------------------------------------
  # Object storage
  #
  # `local` is INCOMPATIBLE with replicaCount > 1: replica A writes an
  # attachment, replica B cannot serve it. This chart does not guard that.
  # ------------------------------------------------------------------------
  STORAGE_DRIVER: {{ .Values.backend.storage.driver | quote }}
  {{- if eq .Values.backend.storage.driver "s3" }}
  STORAGE_S3_BUCKET: {{ .Values.backend.storage.s3.bucket | quote }}
  STORAGE_S3_REGION: {{ .Values.backend.storage.s3.region | quote }}
  {{- if .Values.backend.storage.s3.endpoint }}
  # Operator-configured endpoints are deliberately NOT SSRF-checked — an
  # internal host is a legitimate value here. Tenant-supplied endpoints ARE
  # checked, and that asymmetry must survive any refactor.
  STORAGE_S3_ENDPOINT: {{ .Values.backend.storage.s3.endpoint | quote }}
  {{- end }}
  # Required by MinIO and most non-AWS providers.
  STORAGE_S3_FORCE_PATH_STYLE: {{ .Values.backend.storage.s3.forcePathStyle | quote }}
  {{- end }}

  # ------------------------------------------------------------------------
  # Attachments
  #
  # Fail-closed on a scanner error is the default and it is deliberate: the
  # alternative silently disables scanning at the moment it is not working.
  # ------------------------------------------------------------------------
  VIRUS_SCAN_PROVIDER: {{ .Values.backend.env.VIRUS_SCAN_PROVIDER | quote }}
  VIRUS_SCAN_FAIL_OPEN: {{ .Values.backend.env.VIRUS_SCAN_FAIL_OPEN | quote }}
  {{- if eq (default "" .Values.backend.env.VIRUS_SCAN_PROVIDER) "clamav" }}
  # S-31. Since S-04, VIRUS_SCAN_PROVIDER=clamav with CLAMAV_ENABLED unset
  # FAILS CLOSED — every upload is refused 422 — where it used to skip the scan
  # silently. The chart set the provider and never these three. clamd is
  # provided EXTERNALLY (backend.clamav.host), like PostgreSQL: this chart runs
  # no ClamAV, and guard 6 refuses to render the provider without a host.
  CLAMAV_ENABLED: "true"
  CLAMAV_HOST: {{ .Values.backend.clamav.host | quote }}
  CLAMAV_PORT: {{ .Values.backend.clamav.port | quote }}
  {{- end }}

  # ------------------------------------------------------------------------
  # Certificates
  # ------------------------------------------------------------------------
  {{- if .Values.certificates.verifyBaseUrl }}
  CERT_VERIFY_BASE_URL: {{ .Values.certificates.verifyBaseUrl | quote }}
  {{- else }}
  CERT_VERIFY_BASE_URL: {{ printf "https://%s/verify" .Values.ingress.host | quote }}
  {{- end }}

  {{- if .Values.certificates.acme.enabled }}
  CUSTOM_DOMAINS_ENABLED: "true"
  TLS_AUTO_PROVISION: "true"
  # DEFAULTS TO THE LET'S ENCRYPT STAGING DIRECTORY. Forgetting to point this
  # at production yields certificates no browser trusts, and the failure
  # appears in a browser rather than in any log.
  ACME_DIRECTORY_URL: {{ .Values.certificates.acme.directoryUrl | quote }}
  ACME_ACCOUNT_EMAIL: {{ .Values.certificates.acme.accountEmail | quote }}
  {{- end }}

  # ------------------------------------------------------------------------
  # Schedulers
  #
  # Present only when cron.enabled. They run ONCE PER REPLICA, which is why the
  # chart refuses to render cron.enabled with replicaCount > 1.
  # ------------------------------------------------------------------------
  #
  # Every singleton job also claims its scheduled minute in Redis before it
  # runs (S-33, services/jobMonitor.service.js), so a second replica skips it
  # — but that claim is skipped when Redis is down, so the replica guard stays.
  # Each run is recorded and a failure alerts (P7-02): see `alerts` below.
  # ------------------------------------------------------------------------
  {{- if .Values.backend.cron.enabled }}
  SESSION_CLEANUP_SCHEDULER: {{ .Values.backend.cron.sessionCleanup | quote }}
  BACKUP_SCHEDULER: {{ .Values.backend.cron.backup | quote }}
  RETENTION_SCHEDULER: {{ .Values.backend.cron.retention | quote }}
  {{- with .Values.backend.cron.calibration }}
  CALIBRATION_SCHEDULER: {{ . | quote }}
  {{- end }}
  {{- with .Values.backend.cron.tenantLifecycle }}
  TENANT_LIFECYCLE_SCHEDULER: {{ . | quote }}
  {{- end }}
  {{- with .Values.backend.cron.quarantineSweep }}
  QUARANTINE_SWEEP_SCHEDULER: {{ . | quote }}
  {{- end }}
  {{- else }}
  # Explicitly disabled: this replica is an API pod, not the scheduler.
  # EVERY scheduler, not only retention: before 2026-09-24 only
  # RETENTION_SCHEDULER was set here, so session cleanup, the tenant backup,
  # the calibration sweep and tenant offboarding still ran on every API pod
  # at their defaults (S-40). The webhook dispatcher is the exception — its
  # claim is FOR UPDATE SKIP LOCKED, safe on every replica (ADR-054).
  SESSION_CLEANUP_SCHEDULER: "disabled"
  BACKUP_SCHEDULER: "disabled"
  RETENTION_SCHEDULER: "disabled"
  CALIBRATION_SCHEDULER: "disabled"
  TENANT_LIFECYCLE_SCHEDULER: "disabled"
  QUARANTINE_SWEEP_SCHEDULER: "disabled"
  # The watchdog alerts on the scheduler pod; one per release is enough.
  JOB_WATCHDOG_SCHEDULER: "disabled"
  {{- end }}

  # ------------------------------------------------------------------------
  # Alerting (P7-02). The log line (level error, field alert.key) is always
  # written; these add a push channel. ALERT_WEBHOOK_URL is in the Secret when
  # set (secrets.alertWebhookUrl) — a Slack/Teams webhook URL is a credential.
  # ------------------------------------------------------------------------
  {{- with .Values.alerts.emailTo }}
  ALERT_EMAIL_TO: {{ . | quote }}
  {{- end }}
