apiVersion: v2
name: callibrator
description: >-
  Hospital Device Calibration Platform — umbrella chart. Deploys the backend
  API and the frontend. Stateful dependencies (PostgreSQL with pgvector, Redis,
  RabbitMQ) are expected to be provided externally; running a database from an
  application chart couples the two lifecycles, and a `helm uninstall` that
  takes the database with it is a class of accident worth designing out.
type: application

# Chart version — bump on any chart change.
version: 0.2.0
# The application version this chart targets.
appVersion: "0.1.0"

keywords:
  - calibration
  - healthcare
  - multi-tenant
  - iso17025

home: https://github.com/zed378/callibrator
sources:
  - https://github.com/zed378/callibrator

maintainers:
  - name: Callibrator Team

dependencies:
  - name: backend
    version: 0.1.0
    repository: "file://charts/backend"
    condition: backend.enabled
  - name: frontend
    version: 0.1.0
    repository: "file://charts/frontend"
    condition: frontend.enabled

annotations:
  # Honest status (P7-06, 2026-09-30): installed, upgraded and rolled back on
  # ONE local kind cluster (Kubernetes 1.37, single node, kindnet, local-path,
  # ingress-nginx), with `kubectl apply --dry-run=server` clean. NOT known to
  # deploy on a production cluster — see MEMORY/records/ for what was and was
  # not exercised.
  callibrator.io/validation-status: "kind-validated"
